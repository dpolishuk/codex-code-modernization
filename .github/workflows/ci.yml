name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate package and upstream hashes
        run: python -B plugins/code-modernization-codex/scripts/validate_package.py
      - name: Run adapter tests
        run: python -B -m unittest discover -s plugins/code-modernization-codex/tests -v
      - name: Run retained upstream tests
        run: python -B -m unittest discover -s plugins/code-modernization-codex/vendor/upstream/scripts/tests -v
      - name: Run executable demo
        run: python -B plugins/code-modernization-codex/scripts/demo.py --output "$RUNNER_TEMP/modernization-demo"
